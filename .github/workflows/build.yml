name: Generate LocalWave IPA
on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Auto-Detect Project Schemes
        id: detect_scheme
        run: |
          # lists all schemes inside the project structure to bypass naming guesswork
          echo "=== AVAILABLE SCHEMES ==="
          xcodebuild -list -project localwave.xcodeproj
          
          # automatically extracts the first available scheme name from the project profile
          SCHEME_NAME=$(xcodebuild -list -project localwave.xcodeproj | grep -A 10 "Schemes:" | tail -n +2 | xargs | awk '{print $1}')
          echo "Detected Scheme Target: $SCHEME_NAME"
          echo "SCHEME=$SCHEME_NAME" >> $GITHUB_ENV

      - name: Build Xcode Project (Unsigned)
        run: |
          # utilizes the dynamically detected scheme environment variable ($SCHEME)
          xcodebuild archive \
            -project localwave.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $PWD/build/localwave.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package into Clean Lowercase IPA
        run: |
          mkdir -p Payload
          cp -r build/localwave.xcarchive/Products/Applications/*.app Payload/
          
          # completely flattens the output filename layout for sideloadly
          mv Payload/*.app Payload/localwave.app
          zip -r localwave.ipa Payload

      - name: Deliver Compiled IPA Package File
        uses: actions/upload-artifact@v4
        with:
          name: LocalWave-iOS-Bundle
          path: localwave.ipa
